name: CI панели

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: eml-admintool-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Проверка и сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Настроить Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Сгенерировать Prisma Client
        run: npx prisma generate --no-hints

      - name: Проверить TypeScript и Svelte
        run: npm run check

      - name: Выполнить production-сборку
        run: npm run build
