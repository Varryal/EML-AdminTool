name: Релиз Varryal EML AdminTool

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-varryal.[0-9]+'

jobs:
  build:
    name: Проверка, публикация image и создание релиза
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить, что tag находится в main
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "Ошибка: tag $GITHUB_REF_NAME не находится в ветке main."
            exit 1
          fi
          echo "✅ Tag находится в main."

      - name: Определить и проверить версию Varryal
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          METADATA_VERSION="$(node -p "require('./varryal.json').version")"
          UPSTREAM_VERSION="$(node -p "require('./varryal.json').upstreamVersion")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$VERSION" != "$METADATA_VERSION" ]; then
            echo "Ошибка: версия tag $VERSION не совпадает с varryal.json $METADATA_VERSION"
            exit 1
          fi

          if [ "$UPSTREAM_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Ошибка: varryal.json upstreamVersion $UPSTREAM_VERSION не совпадает с package.json $PACKAGE_VERSION"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Метаданные релиза Varryal согласованы."

      - name: Настроить Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Проверить исходники
        run: |
          npm ci
          npx prisma generate --no-hints
          npm run check
          npm run build

      - name: Сгенерировать release Compose
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises'
          const version = process.env.VERSION
          const template = await fs.readFile('.github/templates/docker-compose.prod.yml', 'utf8')
          await fs.writeFile('docker/docker-compose.prod.yml', template.replace(/\{\{VERSION\}\}/g, version))
          NODE

      - name: Настроить Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Войти в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Подготовить Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/varryal/eml-admintool
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=varryal-latest
          labels: |
            org.opencontainers.image.source=https://github.com/Varryal/EML-AdminTool
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Собрать и отправить Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
