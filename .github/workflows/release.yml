name: Release Varryal EML AdminTool

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-varryal.[0-9]+'

jobs:
  build:
    name: Verify, publish image and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "Error: Tag $GITHUB_REF_NAME is not on the main branch."
            exit 1
          fi
          echo "✅ Tag is on main."

      - name: Resolve and verify Varryal version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          METADATA_VERSION="$(node -p "require('./varryal.json').version")"
          UPSTREAM_VERSION="$(node -p "require('./varryal.json').upstreamVersion")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$VERSION" != "$METADATA_VERSION" ]; then
            echo "Error: tag version $VERSION does not match varryal.json $METADATA_VERSION"
            exit 1
          fi

          if [ "$UPSTREAM_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: varryal.json upstreamVersion $UPSTREAM_VERSION does not match package.json $PACKAGE_VERSION"
            exit 1
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Varryal release metadata is consistent."

      - name: Verify changelog file exists
        run: |
          CHANGELOG_FILE=".github/changelogs/${GITHUB_REF_NAME}.md"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "Error: Changelog file $CHANGELOG_FILE does not exist."
            exit 1
          fi
          echo "✅ Changelog file found."

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify source
        run: |
          npm ci
          npx prisma generate --no-hints
          npm run check
          npm run build

      - name: Generate release compose
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs/promises'
          const version = process.env.VERSION
          const template = await fs.readFile('.github/templates/docker-compose.prod.yml', 'utf8')
          await fs.writeFile('docker/docker-compose.prod.yml', template.replace(/\{\{VERSION\}\}/g, version))
          NODE

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/varryal/eml-admintool
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=varryal-latest
          labels: |
            org.opencontainers.image.source=https://github.com/Varryal/EML-AdminTool
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Varryal EML AdminTool ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          body_path: .github/changelogs/${{ github.ref_name }}.md
          files: docker/docker-compose.prod.yml
