# # # # # # # # # # # # # # # # # # # # # # # # # # # #
#              PRODUCTION CONFIGURATION               #
#                                                     #
# This file is used to setup the application in a     #
# production environment.                             #
#                                                     #
# Varryal releases intentionally do not include the   #
# upstream self-updater service. Update this fork via #
# reviewed releases and controlled deployments only. #
# # # # # # # # # # # # # # # # # # # # # # # # # # # #
#
# Varryal EML AdminTool {{VERSION}}
#

name: eml-admintool

networks:
  network:

services:
  web:
    image: ghcr.io/varryal/eml-admintool:{{VERSION}}
    restart: unless-stopped
    networks:
      - network
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: 'production'
      BODY_SIZE_LIMIT: 'Infinity'
    volumes:
      - files:/app/files
      - env:/app/env
      - data:/app/data
    ports:
      - '8080:3000'
    depends_on:
      - dbs
  dbs:
    image: postgres:18.1
    restart: unless-stopped
    networks:
      - network
    environment:
      POSTGRES_USER: eml
      POSTGRES_PASSWORD: eml
      POSTGRES_DB: eml_admintool
    volumes:
      - database:/var/lib/postgresql

volumes:
  database:
  files:
  env:
  data:
